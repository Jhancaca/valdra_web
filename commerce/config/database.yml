default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  checkout_timeout: <%= ENV.fetch("DATABASE_CHECKOUT_TIMEOUT", 5) %>
  variables:
    statement_timeout: <%= ENV.fetch("DATABASE_STATEMENT_TIMEOUT", 10000) %>

# Supabase is the only application database. Use a session pooler URL with
# sslmode=require for IPv4 development hosts, never a browser-facing Data API key.
development:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL") %>

# Tests must use a separate database or Supabase branch. Never point this to production.
test:
  <<: *default
  url: <%= ENV.fetch("TEST_DATABASE_URL") %>

# Solid Cache, Queue and Cable share the same PostgreSQL database at MVP scale.
# The named URLs permit separating them later without changing application code.
production:
  primary: &primary_production
    <<: *default
    url: <%= ENV.fetch("DATABASE_URL") %>
  cache:
    <<: *primary_production
    url: <%= ENV.fetch("CACHE_DATABASE_URL", ENV.fetch("DATABASE_URL")) %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    url: <%= ENV.fetch("QUEUE_DATABASE_URL", ENV.fetch("DATABASE_URL")) %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    url: <%= ENV.fetch("CABLE_DATABASE_URL", ENV.fetch("DATABASE_URL")) %>
    migrations_paths: db/cable_migrate
